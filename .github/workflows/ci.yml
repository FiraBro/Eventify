name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Go application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Disposable, test-only Redis database. Never point this at production.
      REDIS_URL: redis://localhost:6379/15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.4.0
        with:
          go-version: "1.26.10"
          cache: true
          cache-dependency-path: go.sum

      - name: Check Go formatting
        run: make fmt-check

      - name: Install pinned lint tool
        run: make tools

      - name: Lint
        run: make lint

      - name: Install pinned security scanners
        run: make security-install

      - name: Scan reachable Go vulnerabilities
        # Scanner/network/database errors fail this step; they are not treated as clean results.
        run: make govulncheck

      - name: Run gosec
        run: make gosec

      - name: Run ordinary tests and generate coverage
        run: make coverage

      - name: Run tests with race detector
        run: make test-race

      - name: Run integration tests (PostgreSQL and Redis via Testcontainers/services)
        run: go test -tags=integration -count=1 -timeout=20m ./tests/integration

      - name: Upload coverage report
        if: always() && hashFiles('coverage.out', 'coverage-summary.txt') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage-summary.txt
          if-no-files-found: error
          retention-days: 14
      - name: Run go vet
        run: go vet ./...
