services:
  db:
    image: postgres:16.3
    container_name: local_go_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    container_name: local_go_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
    container_name: local_go_api
    restart: unless-stopped
    command: ["bash", "/app/docker-entrypoint.sh"]
    ports:
      - "8080:8080"
      - "127.0.0.1:${PPROF_PORT:-6060}:${PPROF_PORT:-6060}"
    volumes:
      - .:/app
    environment:
      ADDR: ${ADDR}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}

      # Database connection URLs
      DB_ADDR: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      DB_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"

      # Individual database configuration
      DB_HOST: "db"
      POSTGRES_HOST: "db"
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}

      # Redis cache
      REDIS_URL: "redis://redis:6379/0"

      # Development-only Go profiling
      PPROF_ENABLED: ${PPROF_ENABLED:-false}
      PPROF_PORT: ${PPROF_PORT:-6060}

    depends_on:
      db:
        condition: service_healthy
      # redis:
      #   condition: service_healthy

volumes:
  db_data:
  redis_data:
