basePath: /api/v1
definitions:
  models.Booking:
    properties:
      created_at:
        type: string
      id:
        type: string
      notes:
        type: string
      scheduled_at:
        type: string
      service_id:
        type: string
      status:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.UpdateBookingRequest:
    properties:
      notes:
        type: string
      scheduled_at:
        type: string
    type: object
  models.UpdateBookingStatusRequest:
    properties:
      status:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      delete_deadline:
        type: string
      deleted_at:
        type: string
      email:
        type: string
      id:
        type: string
      password:
        description: allow JSON binding
        type: string
      role:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Interactive live API documentation for the local-go ecosystem.
  title: Local-Go API Engine
  version: "1.0"
paths:
  /admin/users:
    get:
      consumes:
      - application/json
      description: Retrieve every user. Admin only.
      parameters:
      - description: Bearer <JWT_TOKEN>
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get all users (admin)
      tags:
      - admin
  /auth/change-password:
    patch:
      consumes:
      - application/json
      description: 'Change the password of the authenticated user. Body: {"old_password":
        "string", "new_password": "string (min 6 chars)"}'
      parameters:
      - description: Bearer <JWT_TOKEN>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Change password payload
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Change my password
      tags:
      - auth
  /auth/delete-account:
    delete:
      consumes:
      - application/json
      description: Schedules the authenticated user's account for deletion. It can
        be restored within 14 days.
      parameters:
      - description: Bearer <JWT_TOKEN>
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Delete my account (soft delete)
      tags:
      - auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: 'Sends an OTP to the email if it exists. Always returns the same
        response to avoid revealing which emails are registered. Body: {"email": "string"}'
      parameters:
      - description: Email payload
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Request a password reset OTP
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: 'Authenticate with email and password. Returns an access token
        and a refresh token. Body: {"email": "string", "password": "string"}'
      parameters:
      - description: Login credentials (email, password)
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: 'Invalidate the given refresh token. Body: {"refresh_token": "string"}'
      parameters:
      - description: Refresh token payload
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Log out
      tags:
      - auth
  /auth/profile:
    get:
      consumes:
      - application/json
      description: Retrieve the profile of the authenticated user
      parameters:
      - description: Bearer <JWT_TOKEN>
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get my profile
      tags:
      - auth
    patch:
      consumes:
      - application/json
      description: 'Update the username and/or email of the authenticated user. Body:
        {"username": "string", "email": "string"}'
      parameters:
      - description: Bearer <JWT_TOKEN>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Profile update payload
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update my profile
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 'Exchange a valid refresh token for a new access token. Body: {"refresh_token":
        "string"}'
      parameters:
      - description: Refresh token payload
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account. The role defaults to "user" when not
        provided.
      parameters:
      - description: User registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Register a new user
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: 'Set a new password using the OTP sent by email. Body: {"email":
        "string", "otp": "string", "new_password": "string (min 6 chars)"}'
      parameters:
      - description: Reset password payload
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Reset password with OTP
      tags:
      - auth
  /auth/restore-account:
    post:
      consumes:
      - application/json
      description: Restore a soft-deleted account within the 14-day restore window
      parameters:
      - description: Bearer <JWT_TOKEN>
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Restore my account
      tags:
      - auth
  /bookings:
    get:
      consumes:
      - application/json
      description: Retrieve all bookings, optionally filtered by status. Admin only.
      parameters:
      - description: Bearer <JWT_TOKEN>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get all bookings (admin)
      tags:
      - bookings
    post:
      consumes:
      - application/json
      description: Create a new appointment or event booking for the authenticated
        user
      parameters:
      - description: Bearer <JWT_TOKEN>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Booking Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.Booking'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a new booking
      tags:
      - bookings
  /bookings/{id}:
    delete:
      consumes:
      - application/json
      description: Remove a booking completely or transition its system record lifecycle
        out of the calendar.
      parameters:
      - description: Bearer <JWT_TOKEN>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Booking UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Delete/Cancel a booking
      tags:
      - bookings
    get:
      consumes:
      - application/json
      description: Retrieve detailed records for a specific booking. Users can see
        their own; Admins can see any.
      parameters:
      - description: Bearer <JWT_TOKEN>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Booking UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get booking details by ID
      tags:
      - bookings
    patch:
      consumes:
      - application/json
      description: Modify parameters of an existing booking such as schedule, notes,
        or assigned staff.
      parameters:
      - description: Bearer <JWT_TOKEN>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Booking UUID
        in: path
        name: id
        required: true
        type: string
      - description: Update Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateBookingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
      summary: Update a booking
      tags:
      - bookings
  /bookings/{id}/status:
    patch:
      consumes:
      - application/json
      description: Transition the state machine lifecycle status of a specific booking
        record (e.g., confirm, cancel, complete).
      parameters:
      - description: Bearer <JWT_TOKEN>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Booking UUID
        in: path
        name: id
        required: true
        type: string
      - description: Status Target Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateBookingStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
      summary: Update a booking's status
      tags:
      - bookings
  /bookings/my:
    get:
      consumes:
      - application/json
      description: Retrieve a list of bookings belonging exclusively to the authenticated
        user
      parameters:
      - description: Bearer <JWT_TOKEN>
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get my bookings
      tags:
      - bookings
  /users:
    get:
      consumes:
      - application/json
      description: Retrieve users with page-based pagination
      parameters:
      - description: Bearer <JWT_TOKEN>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Page number
        in: query
        name: page
        type: string
      - description: Items per page
        in: query
        name: limit
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get users (paginated)
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Create a new user. The password is removed from the response.
      parameters:
      - description: Bearer <JWT_TOKEN>
        in: header
        name: Authorization
        required: true
        type: string
      - description: User payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Create a user
      tags:
      - users
  /users/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a specific user's public details by their ID
      parameters:
      - description: Bearer <JWT_TOKEN>
        in: header
        name: Authorization
        required: true
        type: string
      - description: User UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get a user by ID
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Update the details of a specific user by ID
      parameters:
      - description: Bearer <JWT_TOKEN>
        in: header
        name: Authorization
        required: true
        type: string
      - description: User UUID
        in: path
        name: id
        required: true
        type: string
      - description: User payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Update a user
      tags:
      - users
  /users/{id}/role:
    patch:
      consumes:
      - application/json
      description: 'Change the role of a specific user. Body: {"role": "string"}'
      parameters:
      - description: Bearer <JWT_TOKEN>
        in: header
        name: Authorization
        required: true
        type: string
      - description: User UUID
        in: path
        name: id
        required: true
        type: string
      - description: Role payload
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update a user's role
      tags:
      - users
swagger: "2.0"
