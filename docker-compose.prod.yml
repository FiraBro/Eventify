services:
  db:
    image: postgres:16.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - prod_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: builder
    entrypoint: ["/go/bin/migrate"]
    command:
      - "-path=/src/cmd/migrate/migration"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: runtime
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8081:8080"
    env_file:
      - .env
    environment:
      APP_ENV: production
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CHAPA_SECRET_KEY: ${CHAPA_SECRET_KEY:?CHAPA_SECRET_KEY is required}
      CHAPA_WEBHOOK_SECRET: ${CHAPA_WEBHOOK_SECRET:?CHAPA_WEBHOOK_SECRET is required}
      GIN_MODE: release
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

networks:
  backend:

volumes:
  prod_db_data:
  prod_redis_data:
